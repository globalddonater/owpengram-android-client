name: Build owpengram APK

on:
  workflow_dispatch: # Ручной запуск сборки кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nalgebra/setup-ndk@v1
        with:
          ndk-version: r25b # Оптимальная версия NDK для сборки Telegram/OwpenGram

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-debug-apk
          path: TMMessagesProj/build/outputs/apk/debug/*.apk
